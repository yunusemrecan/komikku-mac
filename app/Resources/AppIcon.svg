<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A7A"/>
      <stop offset="1" stop-color="#121A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#4C63C9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C63C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="11" cy="11" r="3.2" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#F3EFE6"/>
      <stop offset="1" stop-color="#D9D2C3"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#F3EFE6"/>
      <stop offset="1" stop-color="#D9D2C3"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B5A"/>
      <stop offset="1" stop-color="#E5322D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Background tile (Big Sur grid: 824px body, 100px margin) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
    <!-- speed lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="12" stroke-linecap="round">
      <line x1="512" y1="470" x2="140" y2="170"/>
      <line x1="512" y1="470" x2="300" y2="110"/>
      <line x1="512" y1="470" x2="880" y2="160"/>
      <line x1="512" y1="470" x2="960" y2="330"/>
      <line x1="512" y1="470" x2="110" y2="380"/>
    </g>
  </g>

  <!-- Open book -->
  <g filter="url(#shadow)">
    <!-- page block thickness -->
    <path d="M232 330 L232 742 Q372 712 512 770 Q652 712 792 742 L792 330 Z" fill="#B9AF9C"/>
    <!-- left page -->
    <path d="M512 326 Q380 276 222 300 L222 720 Q380 696 512 748 Z" fill="url(#pageL)"/>
    <!-- right page -->
    <path d="M512 326 Q644 276 802 300 L802 720 Q644 696 512 748 Z" fill="url(#pageR)"/>
  </g>

  <!-- Manga panels: right page (read first, right-to-left) -->
  <g fill="none" stroke="#1B1F2E" stroke-width="9" stroke-linejoin="round">
    <path d="M540 350 Q640 318 770 330 L770 470 Q650 462 540 486 Z"/>
    <path d="M540 512 Q600 498 650 494 L650 700 Q590 702 540 722 Z"/>
    <path d="M674 492 Q722 490 770 494 L770 690 Q720 690 674 696 Z"/>
    <!-- left page -->
    <path d="M484 350 Q384 318 254 330 L254 520 Q380 506 484 532 Z"/>
    <path d="M484 556 Q380 534 254 546 L254 690 Q384 684 484 722 Z"/>
  </g>
  <!-- ink accents inside panels -->
  <!-- manga eye (top-right panel) -->
  <clipPath id="eyeClip"><path d="M580 410 Q655 350 735 400 Q660 452 580 410 Z"/></clipPath>
  <path d="M580 410 Q655 350 735 400 Q660 452 580 410 Z" fill="#FFFFFF"/>
  <g clip-path="url(#eyeClip)">
    <circle cx="660" cy="404" r="34" fill="#1B1F2E"/>
    <circle cx="660" cy="404" r="16" fill="#3B4D9C"/>
    <circle cx="672" cy="392" r="9" fill="#FFFFFF"/>
  </g>
  <path d="M572 412 Q655 340 744 396" fill="none" stroke="#1B1F2E" stroke-width="12" stroke-linecap="round"/>
  <path d="M600 372 L590 352 M630 360 L626 338 M662 356 L664 334" stroke="#1B1F2E" stroke-width="7" stroke-linecap="round"/>
  <!-- speed lines (bottom-middle panel) -->
  <g stroke="#1B1F2E" stroke-width="6" stroke-linecap="round">
    <line x1="552" y1="540" x2="640" y2="520"/>
    <line x1="552" y1="580" x2="640" y2="556"/>
    <line x1="552" y1="620" x2="640" y2="592"/>
    <line x1="552" y1="660" x2="640" y2="628"/>
    <line x1="552" y1="698" x2="640" y2="664"/>
  </g>
  <!-- onomatopoeia burst (bottom-right panel) -->
  <path d="M722 560 l12 -30 l8 28 l26 -14 l-12 28 l28 8 l-28 10 l12 28 l-26 -14 l-8 28 l-12 -30 l-26 16 l10 -30 l-28 -8 l28 -10 l-10 -30 z" fill="#E5322D"/>
  <!-- text lines (bottom-left panel) -->
  <g fill="#1B1F2E">
    <rect x="300" y="600" width="140" height="14" rx="7" opacity="0.85"/>
    <rect x="300" y="628" width="100" height="14" rx="7" opacity="0.85"/>
  </g>
  <!-- halftone in a left panel -->
  <g fill="#1B1F2E" opacity="0.55">
    <circle cx="290" cy="380" r="7"/><circle cx="320" cy="380" r="6"/><circle cx="350" cy="380" r="5"/><circle cx="380" cy="380" r="4"/>
    <circle cx="305" cy="408" r="7"/><circle cx="335" cy="408" r="6"/><circle cx="365" cy="408" r="5"/><circle cx="395" cy="408" r="4"/>
    <circle cx="290" cy="436" r="7"/><circle cx="320" cy="436" r="6"/><circle cx="350" cy="436" r="5"/><circle cx="380" cy="436" r="4"/>
    <circle cx="305" cy="464" r="6"/><circle cx="335" cy="464" r="5"/><circle cx="365" cy="464" r="4"/>
  </g>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path d="M610 168 h170 a70 70 0 0 1 70 70 v40 a70 70 0 0 1 -70 70 h-92 l-58 52 l12 -52 h-32 a70 70 0 0 1 -70 -70 v-40 a70 70 0 0 1 70 -70 z" fill="url(#bubble)"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="673" y="208" width="26" height="74" rx="13"/>
    <circle cx="686" cy="312" r="15"/>
    <rect x="721" y="208" width="26" height="74" rx="13"/>
    <circle cx="734" cy="312" r="15"/>
  </g>
</svg>
