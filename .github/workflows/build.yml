name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the macOS job gets write access only to publish releases
permissions:
  contents: read

jobs:
  backend-linux:
    name: Backend smoke test (Linux, no GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/requirements-mac.lock
      - run: python backend/tests/smoke_test.py

  build:
    name: Build Komikku.app (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: write        # publish nightly / tagged releases
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build app bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.0+$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          KOMIKKU_MAC_VERSION="$VERSION" scripts/build_app.sh --arch arm64

      - name: Smoke test bundled backend
        run: |
          python3 backend/tests/smoke_test.py \
            --python dist/Komikku.app/Contents/Resources/python/bin/python3 \
            --backend dist/Komikku.app/Contents/Resources/backend \
            --upstream dist/Komikku.app/Contents/Resources/upstream

      - name: Live smoke test (MangaDex)
        continue-on-error: true
        run: |
          python3 backend/tests/smoke_test.py --live \
            --python dist/Komikku.app/Contents/Resources/python/bin/python3 \
            --backend dist/Komikku.app/Contents/Resources/backend \
            --upstream dist/Komikku.app/Contents/Resources/upstream

      - name: Launch + reader UI check
        run: |
          # Open the app, let it open a MangaDex chapter by itself, screenshot it
          set +e
          KOMIKKU_AUTOTEST="mangadex:berserk" KOMIKKU_AUTOTEST_DOUBLE=1 KOMIKKU_AUTOTEST_SCREENS=1 \
            dist/Komikku.app/Contents/MacOS/Komikku &
          PID=$!
          mkdir -p screenshots
          sleep 45; screencapture -x screenshots/1-reader.png
          sleep 20; screencapture -x screenshots/2-library.png
          sleep 17; screencapture -x screenshots/3-history.png
          sleep 20
          RUNNING=0
          if kill -0 $PID 2>/dev/null; then RUNNING=1; kill $PID; wait $PID 2>/dev/null; fi
          echo "----- app.log"; cat ~/Library/Logs/Komikku/app.log
          echo "----- backend.log (tail)"; tail -40 ~/Library/Logs/Komikku/backend.log
          grep -q "page 0 displayed" ~/Library/Logs/Komikku/app.log || { echo "Reader did not display a page"; exit 1; }
          grep -q "keytest: left fits=true turned=true" ~/Library/Logs/Komikku/app.log || { echo "Arrow key did not turn a page that fits"; exit 1; }
          grep -q "keytest: left fits=false turned=false" ~/Library/Logs/Komikku/app.log || { echo "Arrow key turned a zoomed page instead of panning"; exit 1; }
          grep -q "backend restarted" ~/Library/Logs/Komikku/app.log || { echo "Backend was not restarted after a crash"; exit 1; }
          grep -q "after restart library=1" ~/Library/Logs/Komikku/app.log || { echo "Library not reloaded after restart"; exit 1; }
          [ $RUNNING = 1 ] || { echo "App exited early"; exit 1; }

      - name: DMG check (mount, contents, screenshot)
        run: |
          set +e
          hdiutil attach dist/Komikku-macos-arm64.dmg -nobrowse -noautoopen -mountpoint /Volumes/Komikku >/dev/null
          ls -la /Volumes/Komikku
          test -x /Volumes/Komikku/Komikku.app/Contents/MacOS/Komikku || { echo "App missing from DMG"; exit 1; }
          codesign --verify --deep -vvv /Volumes/Komikku/Komikku.app 2>&1 | tail -5
          codesign --verify /Volumes/Komikku/Komikku.app || { echo "Signature broken in DMG"; exit 1; }
          open /Volumes/Komikku
          sleep 5
          mkdir -p screenshots
          screencapture -x screenshots/4-dmg.png
          osascript -e 'tell application "Finder" to close every window' >/dev/null 2>&1
          hdiutil detach /Volumes/Komikku -force >/dev/null
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Checksum
        id: sha
        run: |
          cd dist
          SHA=$(shasum -a 256 Komikku-macos-arm64.zip | cut -d' ' -f1)
          DMG_SHA=$(shasum -a 256 Komikku-macos-arm64.dmg | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA" >> "$GITHUB_OUTPUT"
          shasum -a 256 Komikku-macos-arm64.dmg Komikku-macos-arm64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/Komikku-macos-arm64.dmg
            dist/Komikku-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Komikku-macos-arm64
          path: |
            dist/Komikku-macos-arm64.dmg
            dist/Komikku-macos-arm64.zip
            dist/SHA256SUMS

      - name: Publish rolling "nightly" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          cat > /tmp/notes.md <<NOTES
          Son \`main\` derlemesi ($(git rev-parse --short HEAD)) — latest \`main\` build.

          **Kurulum / install:** \`Komikku-macos-arm64.dmg\` dosyasını aç, Komikku'yu Uygulamalar klasörüne sürükle.
          Uygulama imzasız olduğu için ilk açılışta macOS engeller / unsigned app, first launch is blocked:
          - Sistem Ayarları → Gizlilik ve Güvenlik → **Yine de Aç** (System Settings → Privacy & Security → Open Anyway), ya da / or
          - \`xattr -dr com.apple.quarantine /Applications/Komikku.app\`

          | Dosya | SHA256 |
          |---|---|
          | Komikku-macos-arm64.dmg | \`${{ steps.sha.outputs.dmg_sha256 }}\` |
          | Komikku-macos-arm64.zip | \`${{ steps.sha.outputs.sha256 }}\` |

          Doğrulama / verify:
          \`\`\`
          shasum -a 256 Komikku-macos-arm64.dmg
          gh attestation verify Komikku-macos-arm64.dmg -R ${{ github.repository }}
          \`\`\`
          NOTES
          gh release create nightly dist/Komikku-macos-arm64.dmg dist/Komikku-macos-arm64.zip dist/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes-file /tmp/notes.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Komikku-macos-arm64.dmg dist/Komikku-macos-arm64.zip dist/SHA256SUMS \
            --generate-notes \
            --notes "DMG SHA256: \`${{ steps.sha.outputs.dmg_sha256 }}\` — verify: \`gh attestation verify Komikku-macos-arm64.dmg -R ${{ github.repository }}\`"
