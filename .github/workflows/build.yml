name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the macOS job gets write access only to publish releases
permissions:
  contents: read

jobs:
  backend-linux:
    name: Backend smoke test (Linux, no GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/requirements-mac.lock
      - run: python backend/tests/smoke_test.py
      - name: Every Turkish UI text has an English translation
        run: python scripts/i18n.py check

  build:
    name: Build Mekurimac.app (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: write        # publish nightly / tagged releases
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build app bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.0+$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          KOMIKKU_MAC_VERSION="$VERSION" scripts/build_app.sh --arch arm64

      - name: Smoke test bundled backend
        run: |
          python3 backend/tests/smoke_test.py \
            --python dist/Mekurimac.app/Contents/Resources/python/bin/python3 \
            --backend dist/Mekurimac.app/Contents/Resources/backend \
            --upstream dist/Mekurimac.app/Contents/Resources/upstream

      - name: Live smoke test (MangaDex)
        continue-on-error: true
        run: |
          python3 backend/tests/smoke_test.py --live \
            --python dist/Mekurimac.app/Contents/Resources/python/bin/python3 \
            --backend dist/Mekurimac.app/Contents/Resources/backend \
            --upstream dist/Mekurimac.app/Contents/Resources/upstream

      - name: Launch + reader UI check
        run: |
          # Open the app, let it open a MangaDex chapter by itself, screenshot it
          set +e
          KOMIKKU_AUTOTEST="mangadex:berserk" KOMIKKU_AUTOTEST_DOUBLE=1 KOMIKKU_AUTOTEST_SCREENS=1 \
            dist/Mekurimac.app/Contents/MacOS/Komikku &
          PID=$!
          mkdir -p screenshots
          sleep 45; screencapture -x screenshots/1-reader.png
          sleep 20; screencapture -x screenshots/2-library.png
          sleep 17; screencapture -x screenshots/3-history.png
          sleep 20
          RUNNING=0
          if kill -0 $PID 2>/dev/null; then RUNNING=1; kill $PID; wait $PID 2>/dev/null; fi
          echo "----- app.log"; cat ~/Library/Logs/Komikku/app.log
          echo "----- backend.log (tail)"; tail -40 ~/Library/Logs/Komikku/backend.log
          grep -q "page 0 displayed" ~/Library/Logs/Komikku/app.log || { echo "Reader did not display a page"; exit 1; }
          grep -q "keytest: left fits=true turned=true" ~/Library/Logs/Komikku/app.log || { echo "Arrow key did not turn a page that fits"; exit 1; }
          grep -q "keytest: left fits=false turned=false" ~/Library/Logs/Komikku/app.log || { echo "Arrow key turned a zoomed page instead of panning"; exit 1; }
          # The check must run; its answer may fail on shared CI IPs (GitHub API rate limit)
          grep -E "update: (.* available|up to date|check failed)" ~/Library/Logs/Komikku/app.log || { echo "Update check did not run"; exit 1; }
          # Second launch: the library must appear from the UI cache before Python is ready
          dist/Mekurimac.app/Contents/MacOS/Komikku &
          PID2=$!
          sleep 6
          kill $PID2; wait $PID2 2>/dev/null
          grep "ui: library shown from cache" ~/Library/Logs/Komikku/app.log | tail -1
          grep -q "ui: library shown from cache ([1-9]" ~/Library/Logs/Komikku/app.log || { echo "Library not restored from cache"; exit 1; }
          grep -q "keytest: chapter end screen shown=true" ~/Library/Logs/Komikku/app.log || { echo "Chapter end screen not shown"; exit 1; }
          # (the test manga may have a single chapter: only check that read-ahead ran)
          grep -q "read-ahead: manga" ~/Library/Logs/Komikku/app.log || { echo "Read-ahead did not run"; exit 1; }
          grep -q "backend restarted" ~/Library/Logs/Komikku/app.log || { echo "Backend was not restarted after a crash"; exit 1; }
          grep -q "after restart library=1" ~/Library/Logs/Komikku/app.log || { echo "Library not reloaded after restart"; exit 1; }
          [ $RUNNING = 1 ] || { echo "App exited early"; exit 1; }

      - name: Links, Spotlight and statistics check
        run: |
          set +e
          : > ~/Library/Logs/Komikku/app.log
          # Register the app with Launch Services so komikku:// links reach it
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$PWD/dist/Mekurimac.app"
          # Seed a few days of reading so the chart and the top list have data
          DB="$HOME/Library/Application Support/komikku/komikku.db"
          sqlite3 "$DB" "UPDATE chapters SET read = 1, last_read = datetime('now', '-' || (id % 9) || ' days') WHERE manga_id IN (SELECT id FROM mangas WHERE in_library = 1);" || true
          open "komikku://stats"
          sleep 20
          mkdir -p screenshots; screencapture -x screenshots/6-stats.png
          open "komikku://search?q=berserk"
          sleep 15
          screencapture -x screenshots/7-link-search.png
          osascript -e 'tell application "Mekurimac" to quit' >/dev/null 2>&1 || pkill -x Komikku
          sleep 3
          echo "----- log"; grep -E "url:|stats:|spotlight:|global search" ~/Library/Logs/Komikku/app.log
          grep -q "url: komikku://stats" ~/Library/Logs/Komikku/app.log || { echo "komikku:// link not received"; exit 1; }
          grep -q "stats: total=" ~/Library/Logs/Komikku/app.log || { echo "Statistics did not load"; exit 1; }
          grep -q "url: komikku://search?q=berserk" ~/Library/Logs/Komikku/app.log || { echo "Search link not received"; exit 1; }
          exit 0

      - name: English interface check
        run: |
          set +e
          : > ~/Library/Logs/Komikku/app.log
          dist/Mekurimac.app/Contents/MacOS/Komikku -AppleLanguages '(en)' &
          PID=$!
          sleep 20; mkdir -p screenshots; screencapture -x screenshots/8-english.png
          kill $PID; wait $PID 2>/dev/null
          grep "ui: language" ~/Library/Logs/Komikku/app.log
          grep -q "ui: language=en sample=Library" ~/Library/Logs/Komikku/app.log || { echo "English localization not used"; exit 1; }
          # and Turkish stays Turkish
          dist/Mekurimac.app/Contents/MacOS/Komikku -AppleLanguages '(tr)' &
          PID=$!
          sleep 8; kill $PID; wait $PID 2>/dev/null
          grep -q "ui: language=tr sample=Kütüphane" ~/Library/Logs/Komikku/app.log || { echo "Turkish interface broken"; exit 1; }
          exit 0

      - name: In-app update check (installs the current nightly over a copy)
        if: github.event_name == 'push'
        continue-on-error: true   # depends on the GitHub API (rate limits on shared runners)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          NIGHTLY=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" -q .target_commitish)
          echo "nightly: $NIGHTLY  this build: $GITHUB_SHA"
          [ -n "$NIGHTLY" ] && [ "$NIGHTLY" != "$GITHUB_SHA" ] || { echo "No other nightly to update to"; exit 0; }
          rm -rf /tmp/upd && mkdir -p /tmp/upd && ditto dist/Mekurimac.app /tmp/upd/Mekurimac.app
          : > ~/Library/Logs/Komikku/app.log
          KOMIKKU_AUTOTEST_UPDATE=1 KOMIKKU_GITHUB_TOKEN="$GH_TOKEN" /tmp/upd/Mekurimac.app/Contents/MacOS/Komikku &
          for i in $(seq 1 40); do
            sleep 5
            NOW=$(/usr/libexec/PlistBuddy -c "Print :KomikkuCommit" /tmp/upd/Mekurimac.app/Contents/Info.plist 2>/dev/null)
            [ "$NOW" = "$NIGHTLY" ] && break
          done
          sleep 10
          grep -E "updatetest|update:" ~/Library/Logs/Komikku/app.log
          pgrep -fl "/tmp/upd/Mekurimac.app/Contents/MacOS/Komikku"; RELAUNCHED=$?
          pkill -f "/tmp/upd/Mekurimac.app/Contents/MacOS/Komikku"
          codesign --verify --deep /tmp/upd/Mekurimac.app || { echo "Updated app signature invalid"; exit 1; }
          [ "$NOW" = "$NIGHTLY" ] || { echo "App was not replaced by the nightly ($NOW)"; exit 1; }
          [ $RELAUNCHED = 0 ] || { echo "Updated app did not start"; exit 1; }
          ls /tmp/upd   # no leftovers (.old-*)

      - name: Cloudflare challenge check (informative)
        continue-on-error: true
        run: |
          set +e
          : > ~/Library/Logs/Komikku/app.log
          KOMIKKU_AUTOTEST_CHALLENGE="mangafire:one piece" dist/Mekurimac.app/Contents/MacOS/Komikku &
          PID=$!
          sleep 30; mkdir -p screenshots; screencapture -x screenshots/5-challenge.png
          for i in $(seq 1 30); do grep -q "challengetest: [0-9f]" ~/Library/Logs/Komikku/app.log && break; sleep 5; done
          kill $PID 2>/dev/null; wait $PID 2>/dev/null
          echo "----- challenge log"; grep -E "webview:|challengetest:" ~/Library/Logs/Komikku/app.log
          grep -q "challengetest: [1-9][0-9]* results" ~/Library/Logs/Komikku/app.log

      - name: DMG check (mount, contents, screenshot)
        run: |
          set +e
          hdiutil attach dist/Mekurimac-macos-arm64.dmg -nobrowse -noautoopen -mountpoint /Volumes/Mekurimac >/dev/null
          ls -la /Volumes/Mekurimac
          test -x /Volumes/Mekurimac/Mekurimac.app/Contents/MacOS/Komikku || { echo "App missing from DMG"; exit 1; }
          codesign --verify --deep -vvv /Volumes/Mekurimac/Mekurimac.app 2>&1 | tail -5
          codesign --verify /Volumes/Mekurimac/Mekurimac.app || { echo "Signature broken in DMG"; exit 1; }
          open /Volumes/Mekurimac
          sleep 5
          mkdir -p screenshots
          screencapture -x screenshots/4-dmg.png
          osascript -e 'tell application "Finder" to close every window' >/dev/null 2>&1
          hdiutil detach /Volumes/Mekurimac -force >/dev/null
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Checksum
        id: sha
        run: |
          cd dist
          SHA=$(shasum -a 256 Mekurimac-macos-arm64.zip | cut -d' ' -f1)
          DMG_SHA=$(shasum -a 256 Mekurimac-macos-arm64.dmg | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA" >> "$GITHUB_OUTPUT"
          shasum -a 256 Mekurimac-macos-arm64.dmg Mekurimac-macos-arm64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/Mekurimac-macos-arm64.dmg
            dist/Mekurimac-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Mekurimac-macos-arm64
          path: |
            dist/Mekurimac-macos-arm64.dmg
            dist/Mekurimac-macos-arm64.zip
            dist/SHA256SUMS

      - name: Publish rolling "nightly" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          cat > /tmp/notes.md <<NOTES
          Son \`main\` derlemesi ($(git rev-parse --short HEAD)) — latest \`main\` build.

          **Kurulum / install:** \`Mekurimac-macos-arm64.dmg\` dosyasını aç, Mekurimac'ı Uygulamalar klasörüne sürükle.
          Uygulama imzasız olduğu için ilk açılışta macOS engeller / unsigned app, first launch is blocked:
          - Sistem Ayarları → Gizlilik ve Güvenlik → **Yine de Aç** (System Settings → Privacy & Security → Open Anyway), ya da / or
          - \`xattr -dr com.apple.quarantine /Applications/Mekurimac.app\`

          | Dosya | SHA256 |
          |---|---|
          | Mekurimac-macos-arm64.dmg | \`${{ steps.sha.outputs.dmg_sha256 }}\` |
          | Mekurimac-macos-arm64.zip | \`${{ steps.sha.outputs.sha256 }}\` |

          **Kaynak kodu / source code (GPL-3.0-or-later):** [${GITHUB_SHA::8}](${{ github.server_url }}/${{ github.repository }}/tree/${GITHUB_SHA}) — upstream Komikku: [$(git rev-parse --short HEAD:upstream)](${{ github.server_url }}/${{ github.repository }}/tree/$(git rev-parse HEAD:upstream)). Üçüncü taraf lisansları uygulamanın içinde / third-party licenses inside the app: Ayarlar › Hakkında (\`Contents/Resources/Licenses\`).

          Doğrulama / verify:
          \`\`\`
          shasum -a 256 Mekurimac-macos-arm64.dmg
          gh attestation verify Mekurimac-macos-arm64.dmg -R ${{ github.repository }}
          \`\`\`
          NOTES
          gh release create nightly dist/Mekurimac-macos-arm64.dmg dist/Mekurimac-macos-arm64.zip dist/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes-file /tmp/notes.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Mekurimac-macos-arm64.dmg dist/Mekurimac-macos-arm64.zip dist/SHA256SUMS \
            --generate-notes \
            --notes "Source: ${{ github.server_url }}/${{ github.repository }}/tree/${GITHUB_SHA} — DMG SHA256: \`${{ steps.sha.outputs.dmg_sha256 }}\` — verify: \`gh attestation verify Mekurimac-macos-arm64.dmg -R ${{ github.repository }}\`"
