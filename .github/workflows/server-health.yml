name: Server health

# Every week (and on demand): try every server (latest/popular list + open the
# first manga) through the app's own backend, and keep one issue, "Sunucu sağlık
# raporu", up to date with the result. The previous result is stored in that
# issue, so the report also lists what broke or got fixed since last week.

on:
  schedule:
    - cron: '43 5 * * 3'   # Wednesdays 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # create/update the report issue

concurrency:
  group: server-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: Sunucu sağlık raporu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - run: pip install --require-hashes -r backend/requirements-mac.lock

      - name: Previous result (from the report issue)
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
                   -q "map(select(.title == env.TITLE)) | .[0].number // empty")
          echo "ISSUE=$number" >> "$GITHUB_ENV"
          if [ -n "$number" ]; then
            gh issue view "$number" -R "$GITHUB_REPOSITORY" --json body -q .body \
              | python3 -c 'import sys,re,base64; m=re.search(r"<!-- results:([A-Za-z0-9+/=]+) -->", sys.stdin.read()); open("previous.json","wb").write(base64.b64decode(m.group(1)) if m else b"[]")'
          else
            echo '[]' > previous.json
          fi

      - name: Check servers
        run: python backend/tests/server_health.py --json results.json --markdown report.md --previous previous.json

      - name: Publish report
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          {
            cat report.md
            echo
            echo "_[Çalıştırma kaydı]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · haftalık güncellenir_"
            echo
            echo "<!-- results:$(base64 -w0 results.json) -->"
          } > body.md
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-health
          path: |
            results.json
            report.md
